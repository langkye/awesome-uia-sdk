[versions]
alipay-sdk-java = "4.40.626.ALL"
alipay-sdk-java-v3 = "3.1.70.ALL"
auto-service = "1.1.1"
bcprov-jdk18on = "1.78.1"
bcprov-jdk15to18 = "1.78.1"
classgraph = "4.8.184"
commons-codec = "1.20.0"
commons-collections4 = "4.5.0"
commons-lang3 = "3.20.0"
commons-text = "1.15.0"
dom4j = "2.1.4"
error-prone-annotations = "2.40.0"
fastjson = "2.0.60"
fastjson2-extension-spring6 = "2.0.59"
friendly-id = "1.1.0"
grpcNetty = "1.77.0"
gson = "2.13.2"
guava = "33.5.0-jre"
httpclient5 = "5.3.1"
jackson-v2 = "2.21.0"
jackson-bom = "3.1.0-rc1"
javahost = "0.9.12"
junit-junit = "4.13.2"
junit-bom = "6.0.1"
junit-jupiter = "6.0.1"
kotlin = "2.3.0"
kotlinx-serialization-json = "1.9.0"
logback = "1.5.32"
logstash = "7.2"
mapstruct = "1.6.3"
okio = "3.16.4"
okhttp3 = "5.3.2"
protobuf-java = "4.33.1"
slf4j = "2.0.16"
site-gradle-plugin = "1.0.2"
snakeyaml = "2.5"
spring-boot3 = "3.5.7"
spring-boot = "4.0.0"
spring-dependency-management = "1.1.7"
testcontainers = "2.0.2"
transmittable-thread-local = "2.14.5"
vavr = "0.11.0"

####################################################### [常用依赖] #####################################################
[libraries]
alipay-sdk-java = { module = "com.alipay.sdk:alipay-sdk-java", version.ref = "alipay-sdk-java" }
alipay-sdk-java-v3 = { module = "com.alipay.sdk:alipay-sdk-java-v3", version.ref = "alipay-sdk-java-v3" }
auto-service = { module = "com.google.auto.service:auto-service", version.ref = "auto-service" }
auto-service-annotations = { module = "com.google.auto.service:auto-service-annotations", version.ref = "auto-service" }
bcprov-jdk15to18 = { module = "org.bouncycastle:bcprov-jdk15to18", version.ref = "bcprov-jdk15to18" }
bcprov-jdk18on = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bcprov-jdk18on" }
classgraph= { module = "io.github.classgraph:classgraph", version.ref = "classgraph" }
common-lang = { module = "org.apache.commons:commons-lang3", version.ref = "commons-lang3" }
commons-collections4 = { module = "org.apache.commons:commons-collections4", version.ref = "commons-collections4" }
commons-codec = { module = "commons-codec:commons-codec", version.ref = "commons-codec" }
commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commons-lang3" }
commons-text = { module = "org.apache.commons:commons-text", version.ref = "commons-text" }
dom4j = { module = "org.dom4j:dom4j", version.ref = "dom4j" }
error-prone-annotations = { module = "com.google.errorprone:error_prone_annotations", version.ref = "error-prone-annotations" }
fastjson = { module = "com.alibaba:fastjson", version.ref = "fastjson" }
fastjson2 = { module = "com.alibaba.fastjson2:fastjson2", version.ref = "fastjson" }
fastjson2-kotlin = { module = "com.alibaba.fastjson2:fastjson2-kotlin", version.ref = "fastjson" }
fastjson2-extension = { module = "com.alibaba.fastjson2:fastjson2-extension", version.ref = "fastjson" }
friendly-id = { module = "com.devskiller.friendly-id:friendly-id", version.ref = "friendly-id" }
fastjson2-extension-spring6 = { module = "com.alibaba.fastjson2:fastjson2-extension-spring6", version.ref = "fastjson2-extension-spring6" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
grpc-netty = { module = "io.grpc:grpc-netty", version.ref = "grpcNetty" }
httpclient5 = { module = "org.apache.httpcomponents.client5:httpclient5", version.ref = "httpclient5" }
jackson-bom-latest = { module = "tools.jackson:jackson-bom", version.ref = "jackson-bom" }
jackson-bom-v2 = { module = "tools.jackson:jackson-bom", version.ref = "jackson-v2" }
jackson-core-v2 = { module = "com.fasterxml.jackson.core:jackson-core", version.ref = "jackson-v2" }
jackson-databind-v2 = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson-v2" }
javahost = { module = "io.leopard:javahost", version.ref = "javahost" }
junit = { module = "junit:junit", version.ref = "junit-junit" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit-bom" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-bom" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlin-stdlib-jdk8 = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8", version.ref = "kotlin" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization-json" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
logstash-logback-encoder = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logstash" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp3"}
okhttp-jvm = { module = "com.squareup.okhttp3:okhttp-jvm", version.ref = "okhttp3"}
okio = { module = "com.squareup.okio:okio", version.ref = "okio"}
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml"}
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf-java"}
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
spring-dependency-management-gradle-plugin = { module = "io.spring.gradle:dependency-management-plugin", version.ref = "spring-dependency-management" }
stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin"}
stdlib-jdk8 = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8", version.ref = "kotlin"}
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
transmittable-thread-local = { module = "com.alibaba:transmittable-thread-local", version.ref = "transmittable-thread-local" }
vavr = { module = "io.vavr:vavr", version.ref = "vavr" }

####################################################### [常用依赖组 Bundles] #####################################################
[bundles]
# 子模块直接 implementation(libs.bundles.common.utils)
common-utils = [
    "common-lang",
    "fastjson2"
]
project-requirement = [
    "common-lang",
    "okhttp",
    "okhttp-jvm",
    "okio",
    "stdlib",
    "stdlib-jdk8",
]

####################################################### [常用插件] #####################################################
[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
site-gradle-plugin = { id = "com.github.starestarrysky.site-gradle-plugin", version.ref = "site-gradle-plugin" }
spring-boot-dependencies = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependencies = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
