[versions]
alipay-sdk-java = "4.40.626.ALL"
auto-service = "1.1.1"
bcprov-jdk18on = "1.78.1"
bcprov-jdk15to18 = "1.78.1"
classgraph = "4.8.184"
commons-codec = "1.20.0"
commons-collections4 = "4.5.0"
commons-lang3 = "3.20.0"
commons-text = "1.15.0"
dom4j = "2.1.4"
error-prone-annotations = "2.40.0"
fastjson = "2.0.60"
fastjson2-extension-spring6 = "2.0.59"
friendlyId = "1.1.0"
grpcNetty = "1.77.0"
gson = "2.13.2"
guava = "33.5.0-jre"
httpclient5 = "5.3.1"
jackson-bom = "3.0.3"
javahost = "0.9.12"
junit-junit = "4.13.2"
junit-bom = "6.0.1"
junit-jupiter = "6.0.1"
kotlin = "2.3.0"
kotlinx-serialization-json = "1.9.0"
logback = "1.5.22"
logstash = "7.2"
mapstruct = "1.6.3"
okio = "3.16.4"
okhttp3 = "5.3.2"
protobuf-java = "4.33.1"
slf4j = "2.0.16"
site-gradle-plugin = "1.0.2"
snakeyaml = "2.5"
spring-boot3 = "3.5.7"
spring-boot = "4.0.0"
spring-dependency-management = "1.1.7"
testcontainers = "2.0.2"
transmittable-thread-local = "2.14.5"
vavr = "0.11.0"

####################################################### [常用依赖] #####################################################
[libraries]
auto-service = { module = "com.google.auto.service:auto-service", version.ref = "auto-service" }
auto-service-annotations = { module = "com.google.auto.service:auto-service-annotations", version.ref = "auto-service" }
common-lang = { module = "org.apache.commons:commons-lang3", version.ref = "commons-lang3" }
commons-codec = { module = "commons-codec:commons-codec", version.ref = "commons-codec" }
fastjson2 = { module = "com.alibaba.fastjson2:fastjson2", version.ref = "fastjson" }
jackson-bom = { module = "tools.jackson:jackson-bom", version.ref = "jackson-bom" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit-bom" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin"}
stdlib-jdk8 = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8", version.ref = "kotlin"}
slf4j = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
spring-dependency-management-gradle-plugin = { module = "io.spring.gradle:dependency-management-plugin", version.ref = "spring-dependency-management" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }


####################################################### [常用依赖组 Bundles] #####################################################
[bundles]
# 子模块直接 implementation(libs.bundles.common.utils)
common-utils = [
    "common-lang",
    "fastjson2"
]
project-requirement = [
    "stdlib",
    "stdlib-jdk8",
    "common-lang",
]

####################################################### [常用插件] #####################################################
[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
site-gradle-plugin = { id = "com.github.starestarrysky.site-gradle-plugin", version.ref = "site-gradle-plugin" }
spring-boot-dependencies = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependencies = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
