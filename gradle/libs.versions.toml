[versions]
kotlin = "2.3.0"
spring3Boot = "3.5.7"
springBoot = "4.0.0"
springBoot3Dependencies = "3.5.7"
springBootDependencies = "4.0.0"
#springCloud = "2025.0.0"
springCloud = "2025.1.0"
springDependencyManagement = "1.1.7"
#springCloudAlibaba = "2025.0.0.0" # 2025.0.x branch: Corresponds to Spring Cloud 2025.0.x & Spring Boot 3.5.x, JDK 17 or later versions are supported.
springCloudAlibaba = "2025.1.0.0-SNAPSHOT" # 2025.0.x branch: Corresponds to Spring Cloud 2025.0.x & Spring Boot 3.5.x, JDK 17 or later versions are supported.
nacos = "3.0.3"
okhttp3 = "5.3.2"
okio = "3.16.4"
protobufJava = "4.33.1"
testcontainers = "2.0.2"
junit = "4.13.2"
junitBom = "6.0.1"
junitJupiter = "6.0.1"
slf4j = "2.0.16"
logback = "1.5.22"
logstash = "7.2"
dom4j = "2.1.4"
knife4j = "4.4.0"
mapstruct = "1.6.3"
friendlyId = "1.1.0"
commonsLang3 = "3.20.0"
commonsCodec = "1.20.0"
commonsText = "1.15.0"
fastjson2 = "2.0.60"
fastjson2spring6 = "2.0.59"
gson = "2.13.2"
jacksonBom = "3.0.3"
transmittableThreadLocal = "2.14.5"
snakeyaml = "2.5"
swagger1 = "1.6.16"
swagger2 = "2.0.0-rc2"
swagger3 = "2.2.41"
guava = "33.5.0-jre"
grpcNetty = "1.77.0"
classgraph = "4.8.184"
errorProneAnnotations = "2.40.0"
dmJdbcDriver18 = "8.1.3.140"
mysqlConnectorJ = "9.5.0"
ojdbc11 = "23.26.0.0.0"
postgresql = "42.7.8"
druidSpringBootStarter = "1.2.27"
druidSpringBoot3Starter = "1.2.27"
druidSpringBoot4Starter = "1.2.28-SNAPSHOT"
mybatis = "3.5.19"
mybatisPlusBoot3 = "3.5.14"
mybatisPlusBoot4 = "3.5.14"
siteGradlePlugin = "1.0.2"
autoService = "1.1.1"
httpclient5 = "5.3.1"
javahost = "0.9.12"
vavr = "0.11.0"
commonsCollections4 = "4.5.0"
kotlinxSerializationJson = "1.9.0"
bcprovJdk15to18 = "1.78.1"
bcprovJdk18on = "1.78.1"
alipaySdkJava = "4.40.626.ALL"

# 定义常用的依赖组 (Bundles)
[libraries]
kotlinGradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
springBootGradlePlugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "springBoot" }
springBootDependenciesGradlePlugin = { module = "io.spring.gradle:dependency-management-plugin", version.ref = "springBootDependencies" }
springDependencyManagementGradlePlugin = { module = "io.spring.gradle:dependency-management-plugin", version.ref = "springDependencyManagement" }
testcontainersBom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
junitBom = { module = "org.junit:junit-bom", version.ref = "junitBom" }
junitJupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junitJupiter" }
jacksonBom = { module = "tools.jackson:jackson-bom", version.ref = "jacksonBom" }

common-lang = { module = "org.apache.commons:commons-lang3", version.ref = "commonsLang3" }
fastjson2-bundle = { module = "com.alibaba.fastjson2:fastjson2", version.ref = "fastjson2" }
spring-boot-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "springBoot" }
auto-service = { module = "com.google.auto.service:auto-service", version.ref = "autoService" }
auto-service-annotations = { module = "com.google.auto.service:auto-service-annotations", version.ref = "autoService" }

[bundles]
# 子模块直接 implementation(libs.bundles.common.utils)
common-utils = [
    "common-lang",
    "fastjson2-bundle"
]

[plugins]
springBoot = { id = "org.springframework.boot", version.ref = "springBoot" }
springBootDependencies = { id = "org.springframework.boot", version.ref = "springBootDependencies" }
springDependencyManagement = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinSpring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlinJpa = { id = "org.jetbrains.kotlin.plugin.jpa", version.ref = "kotlin" }
siteGradlePlugin = { id = "com.github.starestarrysky.site-gradle-plugin", version.ref = "siteGradlePlugin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
